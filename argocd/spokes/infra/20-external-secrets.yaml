# Wave 20 — External Secrets Operator, spoke counterpart of
# argocd/hub/20-external-secrets.yaml. Previously hub-only (only needed
# there for spoke-registration ExternalSecrets). Now also required on
# every spoke so platform/clustermesh/'s ExternalSecret (wave "25") can
# pull the shared Cluster Mesh CA locally on that cluster — ESO CRs are
# cluster-local; a hub-side SecretStore can't be reused by a spoke.
#
# Needs Cilium's pod networking (wave "10") up first, same as the hub
# install.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-role: workload
  template:
    metadata:
      name: 'external-secrets-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-infra
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 0.10.4
        helm:
          releaseName: external-secrets
      destination:
        server: '{{server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
