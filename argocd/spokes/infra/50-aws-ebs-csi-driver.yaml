# Wave 50 — bumped from wave "20". Provides the 'ebs-csi' StorageClass
# that kube-prometheus-stack (wave "60") and postgresql (wave "50") both
# provision PVCs against, so this must be healthy before either of those
# — that ordering is unaffected by the bump, since 50 is still < 40/50.
#
# BUMPED from "20" to "50": the controller ServiceAccount now carries a
# per-spoke eks.amazonaws.com/role-arn annotation, templated from this
# spoke's cluster registration (see argocd/clusters/spoke-dev-k8s.yaml's
# "irsa-ebs-csi-role-arn" annotation, same static-per-spoke pattern
# already used for cluster-mesh-id/cluster-mesh-ip). That annotation only
# does anything if pod-identity-webhook
# (40-pod-identity-webhook.yaml, wave "40") is already registered and
# serving by the time this Application's controller pod is first created
# — admission mutation happens once, at creation, not on a later resync.
#
# Third source (platform/webhook-guards) adds a PreSync hook Job that
# hard-blocks the controller/node resources from applying until
# pod-identity-webhook is actually Running on this spoke — wave ordering
# alone raced against it on a from-scratch hub bootstrap, same risk
# applies per-spoke. See
# platform/webhook-guards/wait-for-pod-identity-webhook.yaml's header
# comment.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-ebs-csi-driver
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-role: workload
  template:
    metadata:
      name: 'aws-ebs-csi-driver-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "50"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-infra
      sources:
        - repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
          chart: aws-ebs-csi-driver
          targetRevision: "2.63.0"
          helm:
            releaseName: aws-ebs-csi-driver
            valueFiles:
              - $values/platform/values/base/ebs-csi.yaml
            parameters:
              - name: controller.serviceAccount.annotations.eks\.amazonaws\.com/role-arn
                value: '{{metadata.annotations.irsa-ebs-csi-role-arn}}'
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          ref: values
        # - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
        #   targetRevision: main
        #   path: platform/webhook-guards
        #   directory:
        #     include: "wait-for-pod-identity-webhook.yaml"
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 3m