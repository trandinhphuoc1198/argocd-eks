# Wave 20 — needs Cilium's pod networking (wave "10") up first
# Installs Karpenter's controller + CRDs (NodePool, EC2NodeClass).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-role: workload
  template:
    metadata:
      name: 'karpenter-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "20"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-infra
      sources:
        - repoURL: oci://public.ecr.aws/karpenter/karpenter
          chart: karpenter
          targetRevision: "1.14.0"
          helm:
            releaseName: karpenter
            valueFiles:
              - $values/platform/values/base/karpenter.yaml
              - $values/platform/values/spoke/karpenter.yaml
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true