# Wave 31 — spoke counterpart of argocd/hub/31-pod-identity-webhook.yaml.
# Same dependency chain: needs internal-ca-issuer from cert-manager-configs
# (30-cert-manager-configs.yaml, wave "30"), must be registered and
# serving BEFORE aws-ebs-csi-driver (32-aws-ebs-csi-driver.yaml, wave
# "32") creates its controller pod — see that Application's header
# comment for why "before" has to mean "already synced", not just
# "lower wave number".
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pod-identity-webhook
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-role: workload
  template:
    metadata:
      name: 'pod-identity-webhook-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "31"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-infra
      sources:
        - repoURL: https://jkroepke.github.io/helm-charts/
          chart: amazon-eks-pod-identity-webhook
          targetRevision: "2.6.5"   # VERIFY latest before first sync
          helm:
            releaseName: pod-identity-webhook
            valueFiles:
              - $values/platform/values/base/pod-identity-webhook.yaml
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 3m
