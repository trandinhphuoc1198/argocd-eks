# Wave 50 — Spoke counterpart of
# argocd/hub/50-external-secrets.yaml. Must not sync until
# pod-identity-webhook (40-pod-identity-webhook.yaml, wave "40") is
# registered and serving on that spoke — same constraint, enforced by the
# webhook-guards source below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-role: workload
  template:
    metadata:
      name: 'external-secrets-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "50"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-infra
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 0.10.4
          helm:
            releaseName: external-secrets
            valueFiles:
              - $values/platform/values/base/external-secrets.yaml
            parameters:
              - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
                value: '{{metadata.annotations.irsa-external-secrets-role-arn}}'
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          path: platform/webhook-guards
          directory:
            include: "wait-for-pod-identity-webhook.yaml"
      destination:
        server: '{{server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 3m