# Wave 50 — MOVED from wave 20, spoke counterpart of
# argocd/hub/50-external-secrets.yaml. Must not sync until
# pod-identity-webhook (40-pod-identity-webhook.yaml, wave "40") is
# registered and serving on that spoke — same constraint, enforced by the
# webhook-guards source below.
#
# helm.parameters templates the controller ServiceAccount's IRSA
# annotation from THIS spoke's cluster registration
# (argocd/clusters/<name>.yaml's "irsa-external-secrets-role-arn"
# annotation), same static-per-spoke pattern already used for
# aws-ebs-csi-driver's role-arn. Replaces this spoke's previous
# credential path — install_clustermesh_ca_pull's node instance-profile
# grant (modules/ec2, now removed) — that
# platform/clustermesh/spoke/external-secret.yaml relied on implicitly.
#
# clustermesh-ca (moved to 60-clustermesh-ca.yaml) applies an
# ExternalSecret CR and now depends on THIS release's CRDs+controller.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-role: workload
  template:
    metadata:
      name: 'external-secrets-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "50"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-infra
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 0.10.4
          helm:
            releaseName: external-secrets
            parameters:
              - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
                value: '{{metadata.annotations.irsa-external-secrets-role-arn}}'
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          path: platform/webhook-guards
          directory:
            include: "wait-for-pod-identity-webhook.yaml"
      destination:
        server: '{{server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 3m