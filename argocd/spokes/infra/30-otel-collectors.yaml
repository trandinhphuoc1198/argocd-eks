# Wave 30 — custom local chart (platform/charts/otel). Depends on the OTel
# Operator CRDs (20-opentelemetry-operator.yaml, wave "20"):
# OpenTelemetryCollector + Instrumentation.
#
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: otel-collectors
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            cluster-role: workload
  template:
    metadata:
      name: 'otel-collectors-{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "30"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-infra
      sources:
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          path: platform/charts/otel
          helm:
            releaseName: otel
            valueFiles:
              - $values/platform/values/spoke/otel.yaml
            parameters:
              - name: global.clusterName
                value: '{{name}}'
        - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 3m
