apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-infra
  namespace: argocd
spec:
  description: >
    Cluster infrastructure for SPOKE clusters

  sourceRepos:
    - "https://github.com/trandinhphuoc1198/argocd-eks.git"
    - "https://github.com/kubernetes-sigs/gateway-api.git"
    - "https://kubernetes.github.io/cloud-provider-aws"
    - "https://helm.cilium.io/"
    - "https://charts.jetstack.io"
    - "https://charts.external-secrets.io"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://kubernetes-sigs.github.io/aws-ebs-csi-driver"
    - "https://open-telemetry.github.io/opentelemetry-helm-charts"
    - "https://grafana.github.io/helm-charts"
    - "https://grafana-community.github.io/helm-charts"
    - "https://kedacore.github.io/charts"
    - "https://cloudnative-pg.github.io/charts"
    - "https://kubernetes-sigs.github.io/metrics-server/"
    - "oci://public.ecr.aws/karpenter/karpenter"

  destinations:
    - server: "*"
      namespace: kube-system
    - server: "*"
      namespace: gateway-system
    - server: "*"
      namespace: observability
    - server: "*"
      namespace: keda
    - server: "*"
      namespace: cnpg-system
    - server: "*"
      namespace: monitoring
    - server: "*"
      namespace: cert-manager
    - server: "*"
      namespace: cilium-secrets
    - server: "*"
      namespace: external-secrets

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
    - group: apiregistration.k8s.io
      kind: APIService          # metrics-server, KEDA external metrics

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"