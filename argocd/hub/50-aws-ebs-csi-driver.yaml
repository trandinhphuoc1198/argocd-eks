# Wave 50 — bumped from wave "20". Hub previously ran no PVC workloads;
# now Prometheus, Loki, Tempo, and Grafana all need the 'ebs-csi'
# StorageClass. Needs Cilium's pod networking (wave "10") up first, same
# as the spoke counterpart (argocd/spokes/infra/50-aws-ebs-csi-driver.yaml).
#
# Third source (platform/webhook-guards) adds a PreSync hook Job that
# blocks this sync's real resources from applying until
# pod-identity-webhook (wave "40") is actually Running — sync-wave
# ordering alone raced against it on a from-scratch bootstrap. See
# platform/webhook-guards/wait-for-pod-identity-webhook.yaml's header
# comment for the full story.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-ebs-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-hub-observability
  sources:
    - repoURL: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
      chart: aws-ebs-csi-driver
      targetRevision: "2.63.0"
      helm:
        releaseName: aws-ebs-csi-driver
        valueFiles:
          - $values/platform/values/base/ebs-csi.yaml
          - $values/platform/values/hub/ebs-csi.yaml
    - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m