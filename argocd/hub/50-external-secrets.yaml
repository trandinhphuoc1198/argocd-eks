# Wave 50 — MOVED from wave 20. The controller now authenticates via IRSA
# instead of node instance-profile credentials, so it must not sync until
# pod-identity-webhook (40-pod-identity-webhook.yaml, wave "40") is
# registered and serving — same "before, not just lower-wave-number"
# constraint as aws-ebs-csi-driver (50-aws-ebs-csi-driver.yaml): admission
# mutation only happens once, at pod creation. Enforced by the third
# source below (platform/webhook-guards), same PreSync hook pattern.
#
# Anything that applies ExternalSecret/PushSecret/SecretStore custom
# resources (external-secrets-config, clustermesh-ca) now depends on
# THIS release's CRDs+controller and has moved to wave "60" accordingly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-hub
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.10.4
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/values/hub/external-secrets.yaml
    - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
      targetRevision: main
      path: platform/webhook-guards
      directory:
        include: "wait-for-pod-identity-webhook.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m