# Wave 30 — deploys the NodePool + EC2NodeClass for hub (platform/karpenter/hub).
# Needs Karpenter's own CRDs first (20-karpenter.yaml, wave "20").
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-hub
  source:
    repoURL: https://github.com/trandinhphuoc1198/argocd-eks.git
    targetRevision: main
    path: platform/karpenter/hub
    helm:
      releaseName: karpenter-nodepool
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m