# Wave 40 — MOVED FROM argocd/spokes/infra/40-tempo.yaml. Tempo now runs
# only on hub. storageClass override kept inline since the values file
# already sets storageClass: ebs-csi directly now that hub owns that
# StorageClass (20-aws-ebs-csi-driver.yaml, wave "20").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-hub-observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo-distributed
      targetRevision: "1.60.0"
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/values/hub/tempo.yaml
    - repoURL: https://github.com/trandinhphuoc1198/k8s_ArgoCD.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
