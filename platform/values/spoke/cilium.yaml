# platform/values/spoke/cilium.yaml
#
# Spoke-tier overlay, layered on top of platform/values/base/cilium.yaml by
# argocd/spokes/infra/00-cilium.yaml. Same chart version cloud-init already
# used on fresh spoke nodes, so the first ArgoCD sync per spoke should be a
# no-op upgrade, not a CNI restart.
#

# k8sServiceHost/k8sServicePort are filled in at node-bootstrap time by
# cloud-init-control-plane.sh (--set flags) for the very first install; the
# value below is what's committed as the steady-state default once ArgoCD
# takes over as source of truth.
k8sServiceHost: "10.1.11.10"
k8sServicePort: "6443"

# ── IRSA for cilium-operator — same rationale as hub's file. Per-spoke role
# ARN, not shared with hub — VERIFY key paths as noted there.
operator:
  extraVolumes:
    - name: aws-iam-token
      projected:
        sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: token
  extraVolumeMounts:
    - name: aws-iam-token
      mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
      readOnly: true
  extraEnv:
    - name: AWS_ROLE_ARN
      value: "arn:aws:iam::633825695180:role/spoke-dev-irsa-cilium-operator"
    - name: AWS_WEB_IDENTITY_TOKEN_FILE
      value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
    - name: AWS_REGION
      value: "ap-northeast-1"