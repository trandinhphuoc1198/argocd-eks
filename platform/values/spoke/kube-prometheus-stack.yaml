# platform/values/spoke/kube-prometheus-stack.yaml
#
# REWRITTEN for the hub/spoke observability re-split: this Prometheus now
# runs in AGENT MODE. It still uses the Prometheus Operator + ServiceMonitor/
# PodMonitor CRDs to discover scrape targets on this spoke (KEDA's triggers,
# every chart's own ServiceMonitor, cilium-servicemonitors, etc. are
# UNCHANGED and keep working) — it just has no local TSDB/query API and no
# local Grafana/Alertmanager. Every sample is remote_written to the hub's
# central Prometheus over the Cluster Mesh global "monitoring-hub-prometheus"
# Service (platform/values/hub/kube-prometheus-stack.yaml).
#
# IMPORTANT: with prometheus.agentMode: true, this Prometheus has NO query
# API — nothing on this spoke (KEDA, Grafana, dashboards) can query it.
# KEDA's ScaledObjects (services/fastapi-app, services/_unreleased/ai-agent-backend)
# now point their prometheus trigger's serverAddress at the hub Prometheus
# instead. That is a real new runtime dependency: spoke autoscaling now
# needs hub to be reachable over Cluster Mesh. See the values files for
# those charts.
#
# fullnameOverride is set here (not in the ApplicationSet's valuesObject)
# — same reasoning as the hub file: it's a static string, no ArgoCD-level
# templating need. Note this is "monitoring" (unchanged from before the
# re-split) while hub's is "monitoring-hub" — see hub's file for why they
# must differ.
fullnameOverride: monitoring

prometheus:
  # Chart-level switch that puts the generated Prometheus CR into
  # `spec.mode: Agent` and adjusts a few agent-incompatible defaults
  # (alerting/rules evaluation, remote-read) automatically.
  agentMode: true

  prometheusSpec:
    remoteWrite:
      - url: "http://monitoring-hub-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        # Reasonable defaults for a cross-cluster (mesh) push — tune once
        # you've measured actual sample volume from this spoke.
        queueConfig:
          maxSamplesPerSend: 1000
          capacity: 5000
          maxShards: 10

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Agent mode still needs a small WAL volume for the remote_write queue —
    # not a full TSDB, so this can stay small.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: ebs-csi
          resources:
            requests:
              storage: 1Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 400Mi

  # No spoke-local query API, so nothing should route to it externally.
  ingress:
    enabled: false

# ── Grafana / Alertmanager moved to hub — disable both here ────────────────
grafana:
  enabled: false

alertmanager:
  enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  priorityClassName: system-node-critical
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
