# platform/values/spoke/aws-ccm.yaml
#
# Spoke-tier overlay, layered on top of platform/values/base/aws-ccm.yaml by
# argocd/spokes/infra/00-aws-ccm.yaml.
extraVolumes:
  - name: aws-iam-token
    projected:
      sources:
        - serviceAccountToken:
            audience: sts.amazonaws.com
            expirationSeconds: 3600
            path: token

extraVolumeMounts:
  - name: aws-iam-token
    mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
    readOnly: true

env:
  - name: AWS_ROLE_ARN
    value: "arn:aws:iam::164892691239:role/spoke-dev-irsa-aws-ccm"
  - name: AWS_WEB_IDENTITY_TOKEN_FILE
    value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
  - name: AWS_REGION
    value: "ap-northeast-1"