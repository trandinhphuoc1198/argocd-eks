# platform/values/base/ebs-csi.yaml
#
# Shared across every deployment tier. Consumed by BOTH:
#   - argocd/hub/32-aws-ebs-csi-driver.yaml            (hub)
#   - argocd/spokes/infra/32-aws-ebs-csi-driver.yaml   (every spoke)
#
# PROMOTED here from platform/values/spoke/ebs-csi.yaml as of the
# hub/spoke observability re-split — hub now needs the same 'ebs-csi'
# StorageClass for Prometheus/Loki/Tempo/Grafana persistence, and the
# config is identical on both tiers, so this belongs in base/ per this
# repo's own base+tier convention (see argocd/README.md#hub-vs-spoke-values)
# rather than duplicated per-tier. Add a platform/values/hub/ebs-csi.yaml
# or platform/values/spoke/ebs-csi.yaml override file only if hub and
# spoke ever actually need to diverge.
storageClasses:
  - name: ebs-csi
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    parameters:
      type: gp3
      encrypted: "true"

controller:
  replicaCount: 2
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: hostname
  #     whenUnsatisfiable: DoNotSchedule
  #     labelSelector:
  #       matchLabels:
  #         app: ebs-csi-controller
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # ── ServiceAccount — declared explicitly for IRSA
  serviceAccount:
    create: true
    name: ebs-csi-controller-sa

  # ── Opt this controller pod into the pod-identity-webhook's fail-closed
  # scope (platform/values/base/pod-identity-webhook.yaml ->
  # mutatingWebhook.objectSelector.matchLabels). Without this label the
  # webhook's objectSelector never matches this pod at all, so the
  # eks.amazonaws.com/role-arn annotation on serviceAccount above would
  # silently never get mutated in — same failure mode this whole change
  # exists to catch, just one layer up. Key confirmed as controller.podLabels
  # against the pinned chart tag (aws-ebs-csi-driver-2.63.0).
  podLabels:
    irsa.internal/inject: "true"

node:
  priorityClassName: system-node-critical
  tolerations:
    - key: workload-tier
      operator: Equal
      value: workload
      effect: NoSchedule
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
