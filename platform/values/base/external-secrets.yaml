# Opts the controller pod into the pod-identity-webhook's fail-closed
# scope (platform/values/base/pod-identity-webhook.yaml ->
# mutatingWebhook.objectSelector.matchLabels). Without this label the
# webhook's objectSelector never matches this pod, so the role-arn
# annotation above would silently never get mutated in if the webhook
# happened to be unreachable at admission time — same symptom that made
# manual pod delete+recreate necessary before this fix. Key confirmed as
# top-level podLabels against the pinned chart tag (external-secrets-0.10.4).
podLabels:
  irsa.internal/inject: "true"