# platform/values/hub/aws-ccm.yaml
#
# ── IRSA — injected directly (no pod-identity-webhook dependency).
# VERIFY top-level `extraVolumes` / `extraVolumeMounts` / `env` against
# `helm show values aws-cloud-controller-manager --version 0.0.11` — this
# chart is small/unofficial-adjacent, key names aren't as standardized as
# cilium's.
extraVolumes:
  - name: aws-iam-token
    projected:
      sources:
        - serviceAccountToken:
            audience: sts.amazonaws.com
            expirationSeconds: 3600
            path: token

extraVolumeMounts:
  - name: aws-iam-token
    mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
    readOnly: true

env:
  - name: AWS_ROLE_ARN
    value: "arn:aws:iam::164892691239:role/hub-dev-irsa-aws-ccm"
  - name: AWS_WEB_IDENTITY_TOKEN_FILE
    value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
  - name: AWS_REGION
    value: "ap-northeast-1"