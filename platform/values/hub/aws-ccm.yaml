# platform/values/hub/aws-ccm.yaml
#
# Hub-tier overlay, layered on top of platform/values/base/aws-ccm.yaml by
# argocd/hub/00-aws-ccm.yaml. Empty today — the hub runs CCM identically to
# spoke. Add keys here if that ever changes; do not edit base/aws-ccm.yaml
# to special-case the hub.
#
# Terraform installed CCM on the hub originally — verify `helm get values
# aws-cloud-controller-manager -n kube-system` matches base + this file
# before enabling automated sync.
args:
  - --v=6
  - --cloud-provider=aws
  # Native routing (see platform/values/base/cilium.yaml) needs AWS VPC
  # route tables kept in sync with each node's pod CIDR — this is exactly
  # what CCM's route controller does (watches node.spec.podCIDR, creates/
  # deletes the matching VPC route). It discovers the target route table
  # via the kubernetes.io/cluster/<cluster-name> tag applied in
  # modules/vpc, and needs ec2:CreateRoute/DeleteRoute on top of the
  # DescribeRouteTables permission master_ccm_policy already has — see
  # modules/ec2/main.tf.
  - --configure-cloud-routes=true
  - --cluster-cidr=100.64.0.0/16
  