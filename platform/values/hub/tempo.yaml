# platform/values/hub/tempo.yaml
#
# MOVED FROM platform/values/spoke/tempo.yaml. Tempo now runs only on hub.
# The OTel aggregator (now also hub-only, platform/values/hub/otel.yaml)
# sends to "tempo-distributor.observability.svc.cluster.local:4317" —
# same-cluster now, plain in-cluster DNS, no Cilium global annotation
# needed. Storage backend (S3) and every component below is otherwise
# unchanged from the old spoke file.

global:
  clusterDomain: cluster.local
  # ── IRSA opt-in for the scoped pod-identity-webhook fail-closed policy
  # (platform/values/base/pod-identity-webhook.yaml ->
  # mutatingWebhook.objectSelector.matchLabels). global.podLabels is the
  # correct hook — VERIFIED against templates/_helpers.tpl's
  # "tempo.podLabels" define at the pinned tag (tempo-distributed-1.60.0,
  # https://github.com/grafana-community/helm-charts):
  #   {{- if .ctx.Values.global.podLabels }}
  #   {{ toYaml .ctx.Values.global.podLabels | indent 0 }}
  # every component (ingester, distributor, compactor, querier,
  # queryFrontend, metricsGenerator) calls this same helper, so one key
  # here covers all of them — no need to duplicate the label into each
  # component's own podLabels block below.
  #
  # NOTE — this label alone does nothing yet: serviceAccount below has no
  # eks.amazonaws.com/role-arn annotation, so there's nothing for the
  # webhook to inject even once it matches these pods. Tempo currently
  # reads/writes S3 via the hub node's EC2 instance-profile role — this
  # is the same gap flagged in README.md's "Known Gaps" #7. Add the IRSA
  # role ARN below once that role exists (mirrors ebs-csi.yaml's
  # serviceAccount.annotations pattern); until then this just pre-wires
  # the label so enabling IRSA later is a one-line change.
  podLabels:
    irsa.internal/inject: "true"

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-s3-phuoctd6       
      region: ap-northeast-1               
      insecure: false                      # keep false — S3 always uses TLS
      endpoint: s3.ap-northeast-1.amazonaws.com

serviceAccount:
  create: true
  name: tempo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::164892691239:role/hub-dev-irsa-tempo

traces:
  otlp:
    grpc:
      enabled: true

distributor:
  replicas: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 60

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 64Mi

ingester:
  replicas: 2   # must not be lower than replication_factor

  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 1000m
      memory: 200Mi

  persistence:
    enabled: true
    storageClass: ebs-csi
    size: 1Gi
    accessModes:
      - ReadWriteOnce

  extraEnv:
    - name: AWS_REGION
      value: ap-northeast-1

  config:
    replication_factor: 2

querier:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 128Mi

  extraEnv:
    - name: AWS_REGION
      value: ap-northeast-1

queryFrontend:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 64Mi

compactor:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 200Mi

  extraEnv:
    - name: AWS_REGION
      value: ap-northeast-1

  config:
    compaction:
      block_retention: 24h

memcached:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 64Mi

metaMonitoring:
  serviceMonitor:
    enabled: true

metricsGenerator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 256Mi

overrides:
  defaults:
    metrics_generator:
      processors: ['service-graphs', 'span-metrics', 'local-blocks']
      generate_native_histograms: both
