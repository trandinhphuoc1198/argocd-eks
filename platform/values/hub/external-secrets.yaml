# platform/values/hub/external-secrets.yaml
#
# Hub-tier overlay, layered on top of the external-secrets chart's own
# defaults by argocd/hub/50-external-secrets.yaml. Wires the controller
# ServiceAccount to the IRSA role created by modules/irsa for hub
# (live/hub/main.tf -> module.irsa.roles["external-secrets"]).
#
# This role replaces BOTH of ESO's previous credential paths on hub:
#   - argocd-clusters-store used a static aws-creds Secret (access key/
#     secret key from an IAM user, seeded by the now-removed
#     .github/scripts/bootstrap-eso-secret.sh.tpl) — see
#     platform/external-secrets-config/argocd-clusters-store.yaml, which
#     no longer has an auth.secretRef block.
#   - clustermesh-secrets-store relied on the node's EC2 instance-profile
#     IAM role (install_clustermesh_ca_push on modules/ec2, now removed).
#
# Requires argocd/hub/40-pod-identity-webhook.yaml to already be synced —
# this annotation alone does nothing without that webhook running to
# inject AWS_WEB_IDENTITY_TOKEN_FILE + the projected SA token volume at
# pod admission. See that file's header comment.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::633825695180:role/hub-dev-irsa-external-secrets"