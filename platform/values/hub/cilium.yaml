# platform/values/hub/cilium.yaml
#
# Hub-tier overlay, layered on top of platform/values/base/cilium.yaml by
# argocd/hub/00-cilium.yaml. Cilium on the hub is installed by Terraform
# (not this repo) — this file is what ArgoCD adopts against on takeover.
# Before enabling automated sync, diff `helm get values cilium -n
# kube-system` on the live hub against base + this file merged.
#

# Must match pod_cidr in every live/*/envs/*/terraform.tfvars. Tells
# Cilium which destination IPs are "in-cluster" (route natively, never
# masquerade) vs external (masquerade via bpf.masquerade below).

k8sServiceHost: "10.0.11.10"
k8sServicePort: "6443"

# ── Cluster Mesh identity ────────────────────────────────────────────────
# Every meshed cluster needs a globally-unique name + numeric id (1-255).
# Hub is hardcoded here since there's only ever one hub. Spokes get theirs
# templated per-cluster in argocd/spokes/infra/10-cilium.yaml from the
# cluster-mesh-id label set in argocd/clusters/<name>.yaml — see
# bootstrap/README.md for the id registry (which ids are taken).
#
# id "1" is reserved for hub; spokes start at "2".
cluster:
  name: hub
  id: 1

# ── IRSA for cilium-operator (ENI IPAM: DescribeSubnets, CreateNetworkInterface,
# AssignPrivateIpAddresses, ...) — injected directly, NOT via pod-identity-webhook,
# so this has no dependency on that webhook's sync wave. See
# https://www.anthropic.com (n/a) — VERIFY these key paths against
# `helm show values cilium/cilium --version 1.20.0-rc.1`; operator.extraEnv /
# operator.extraVolumes / operator.extraVolumeMounts are the conventional
# names for this chart family but must be confirmed before first sync.
operator:
  extraVolumes:
    - name: aws-iam-token
      projected:
        sources:
          - serviceAccountToken:
              audience: sts.amazonaws.com
              expirationSeconds: 3600
              path: token
  extraVolumeMounts:
    - name: aws-iam-token
      mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
      readOnly: true
  extraEnv:
    - name: AWS_ROLE_ARN
      value: "arn:aws:iam::164892691239:role/hub-dev-irsa-cilium-operator"
    - name: AWS_WEB_IDENTITY_TOKEN_FILE
      value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
    - name: AWS_REGION
      value: "ap-northeast-1"