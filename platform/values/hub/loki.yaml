# platform/values/hub/loki.yaml
#
# MOVED FROM platform/values/spoke/loki.yaml. Loki now runs only on hub —
# spokes forward logs to hub's OTel aggregator (via the DaemonSet's
# loadbalancing exporter, over Cluster Mesh), and only the hub-side
# aggregator talks to Loki directly (same-cluster now, plain in-cluster
# DNS — no Cilium global annotation needed here).
#
# Content is unchanged from the old spoke file below.

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: loki-s3-phuoctd6 
      ruler: loki-s3-phuoctd6   
      admin: loki-s3-phuoctd6
    s3:
      endpoint: ""                 # leave empty for AWS S3
      region: ap-northeast-1       # ← change to your region
      s3ForcePathStyle: false      # set true for MinIO / path-style S3
      insecure: false              # set true for MinIO without TLS
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::164892691239:role/hub-dev-irsa-loki

# ── IRSA opt-in for the scoped pod-identity-webhook fail-closed policy ────
# (platform/values/base/pod-identity-webhook.yaml ->
# mutatingWebhook.objectSelector.matchLabels). `defaults.podLabels` is the
# right hook — VERIFIED against templates/_pod.tpl at the pinned tag
# (loki-12.0.0, https://github.com/grafana-community/helm-charts):
#   {{- with (mergeOverwrite (dict) .Values.loki.podLabels .Values.defaults.podLabels $component.podLabels) }}
# i.e. defaults.podLabels is merged into every component pod (singleBinary,
# ingester, querier, distributor, etc.) that goes through the shared pod
# template — so this one key covers the deployment regardless of which
# deploymentMode is active, without having to duplicate the label into
# every per-component podLabels block individually.
#
# NOTE — this label alone does nothing yet: the ServiceAccount below has
# no eks.amazonaws.com/role-arn annotation, so there's nothing for the
# webhook to inject even once it matches this pod. Loki currently reads
# S3 via the hub node's EC2 instance-profile role — this is the exact gap
# flagged in README.md's "Known Gaps" #7 ("Tempo/Loki S3 access relies on
# EC2 instance-profile IAM, unverified in production"). Add the IRSA role
# ARN below once that role exists (mirrors ebs-csi.yaml's
# serviceAccount.annotations pattern) — until then this just pre-wires
# the label so enabling IRSA later is a one-line change, not two.
defaults:
  podLabels:
    irsa.internal/inject: "true"

minio:
  enabled: false
      
deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 200Mi         
    limits:
      cpu: 500m
      memory: 200Mi


# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
lokiCanary:
  kind: Deployment

chunksCache:
  enabled: true
  allocatedMemory: 256      # in MB — this drives the -m flag passed to memcached
  resources:
    requests:
      cpu: 100m
      memory: 64Mi         # set slightly above allocatedMemory to give memcached headroom
    limits:
      cpu: 500m
      memory: 64Mi

resultsCache:
  enabled: true             # note: true not "enabled" (your current value is a string bug)
  allocatedMemory: 256
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 64Mi

monitoring:
  serviceMonitor:
    enabled: true
    labels: {}        # extra labels for the ServiceMonitor
    interval: 30s
    scrapeTimeout: 10s
