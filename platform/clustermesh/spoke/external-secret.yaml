# platform/clustermesh/spoke/external-secret.yaml
#
# SPOKE ONLY. Pulls the Cluster Mesh root CA that
# platform/clustermesh/hub/ca-pushsecret.yaml pushed to AWS Secrets
# Manager, materializing it as a local "clustermesh-ca" Secret that
# common/ca-issuer.yaml (deployed alongside this on every cluster) then
# uses to issue this spoke's own clustermesh certs from the shared root.
#
# No manual bootstrap step needed anymore — hub generates + pushes the
# root automatically (see hub/ca-certificate.yaml's DR warning for the one
# real risk that remains: don't let hub's local Secret get deleted and
# silently regenerated).
#
# References common/secret-store.yaml's "clustermesh-secrets-store" —
# spokes only ever need READ (secretsmanager:GetSecretValue) on
# "clustermesh/*", unlike hub's write-capable role for the push side.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clustermesh-ca
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: clustermesh-secrets-store
    kind: SecretStore
  target:
    name: clustermesh-ca
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: clustermesh/ca
