# platform/clustermesh/hub/ca-pushsecret.yaml
#
# HUB ONLY. Pushes the locally-generated "clustermesh-ca" Secret (see
# ca-certificate.yaml, this directory) out to AWS Secrets Manager, so
# every spoke's ExternalSecret (platform/clustermesh/spoke/) can pull the
# exact same root. This is the reverse direction from a normal
# ExternalSecret — PushSecret writes cluster → AWS instead of AWS →
# cluster.
#
# Reuses common/secret-store.yaml's "clustermesh-secrets-store", but note
# it needs a DIFFERENT, BROADER IAM grant than every spoke's copy of that
# same SecretStore object: hub's node instance-profile role needs
# secretsmanager:CreateSecret, PutSecretValue, DescribeSecret, and
# TagResource on "clustermesh/*" (write), not just GetSecretValue (read,
# which is all spokes ever need). Since the SecretStore manifest itself is
# identical everywhere (deployed from common/), this permission
# distinction has to be enforced on the AWS side (per-cluster instance
# profile policy), not visible anywhere in this repo — worth a comment on
# whichever Terraform module defines the hub's instance-profile policy.
#
# Verify the exact PushSecret schema against the installed ESO version
# (0.10.4) before first sync — `kubectl explain pushsecret.spec` — this
# CRD is newer/less commonly used than ExternalSecret and schema details
# have shifted across ESO releases.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: clustermesh-ca
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: clustermesh-secrets-store
      kind: SecretStore
  selector:
    secret:
      name: clustermesh-ca
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: clustermesh/ca
          property: tls\.crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: clustermesh/ca
          property: tls\.key