apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: argocd-clusters-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      # No auth.secretRef — the ESO controller pod authenticates via IRSA
      # (external-secrets ServiceAccount annotated with
      # eks.amazonaws.com/role-arn — see
      # platform/values/hub/external-secrets.yaml and modules/irsa's
      # "external-secrets" role in live/hub/main.tf). Replaces the
      # previous static aws-creds Secret (IAM user access key), seeded by
      # the now-removed .github/scripts/bootstrap-eso-secret.sh.tpl.