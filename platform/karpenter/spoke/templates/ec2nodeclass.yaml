{{- $clusterName := required "clusterName must be set via ApplicationSet helm.parameters" .Values.clusterName }}
{{- $instanceProfile := .Values.instanceProfile | default (printf "%s-worker-profile" $clusterName) }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: Custom
  amiSelectorTerms:
    - id: {{ .Values.ami.id }}

  instanceProfile: {{ $instanceProfile | quote }}

  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/{{ $clusterName }}: "owned"

  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/{{ $clusterName }}: "owned"

  blockDeviceMappings:
    - deviceName: {{ .Values.rootDevice }}
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true

  # TODO(you): required action — port your kubeadm join / cloud-init
  # worker bootstrap here. Same script should work unmodified across
  # every spoke as long as the join logic itself is cluster-agnostic
  # (reads its own join token/endpoint at boot rather than baking one in).
  userData: |
    #!/bin/bash
    # TODO(you): required action — add kubeadm join / cloud-init bootstrap.

  tags:
    kubernetes.io/cluster/{{ $clusterName }}: "owned"
    karpenter.sh/managed: "true"