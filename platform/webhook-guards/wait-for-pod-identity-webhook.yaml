# platform/webhook-guards/wait-for-pod-identity-webhook.yaml
#
# PreSync hook for aws-ebs-csi-driver (hub: argocd/hub/50-aws-ebs-csi-driver.yaml,
# spoke: argocd/spokes/infra/50-aws-ebs-csi-driver.yaml).
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-for-pod-identity-webhook
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-for-pod-identity-webhook
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-for-pod-identity-webhook
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
subjects:
  - kind: ServiceAccount
    name: wait-for-pod-identity-webhook
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wait-for-pod-identity-webhook
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-pod-identity-webhook
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wait-for-pod-identity-webhook
    spec:
      serviceAccountName: wait-for-pod-identity-webhook
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: registry.k8s.io/kubectl:v1.30.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No shell in this image — call kubectl directly, no `sh -c`.
          command:
            - "kubectl"
          args:
            - "-n"
            - "kube-system"
            - "rollout"
            - "status"
            - "deployment/pod-identity-webhook-amazon-eks-pod-identity-webhook"
            - "--timeout=180s"